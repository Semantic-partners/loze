# A preview deploy per pull request.
#
# docs/ is not in git — scripts/build.py writes it — so there is otherwise no
# way for a reviewer to see what a branch does to the site short of checking it
# out and building it. This builds it for them.
#
# The Pages project is Direct Upload (no Git connection), so Cloudflare never
# sees this repo. What it needs instead is two repository secrets:
#
#   CLOUDFLARE_API_TOKEN   a token with the Cloudflare Pages:Edit permission
#   CLOUDFLARE_ACCOUNT_ID  the account the loze project sits in
#
# Merges to main are published by publish.yml, which uses the same two secrets.
name: preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# A second push to the same branch makes the first preview pointless.
concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Secrets are not exposed to a pull request from a fork, so the deploy would
    # fail rather than being denied. Skip it and leave the PR unannotated.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install rdflib pyyaml

      - name: Test the calendar periods generator
        run: python3 -m unittest discover -s calendar-periods -v

      - name: Build the site
        run: python3 scripts/build.py

      # check.py asserts every term resolves, every page can reach the root, and
      # the kind chips agree with rdf:type. A branch that fails it should not get
      # a URL that looks like a working preview.
      - name: Check the output
        run: python3 scripts/check.py

      - name: Deploy a preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy docs
            --project-name=loze
            --branch=${{ github.head_ref }}

      # wrangler reports every credential problem as the same "Authentication
      # error [code: 10000]". Ask the API what it makes of the credentials and
      # print the answer. Deliberately no interpretation: the next failure will
      # be wrong in some new way, and a stale hint reads as fact. Error bodies
      # only — the token is never echoed, and GitHub masks it regardless.
      - name: Ask the API what it makes of the credentials
        if: failure()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" \
                       -H "Content-Type: application/json" "$@"; }

          echo "--- token ---"
          api https://api.cloudflare.com/client/v4/user/tokens/verify \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("success:", d.get("success")); print("status :", (d.get("result") or {}).get("status")); print("errors :", d.get("errors"))'

          echo "--- pages projects on CLOUDFLARE_ACCOUNT_ID ---"
          api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("success:", d.get("success")); print("errors :", d.get("errors")); print("projects:", [p.get("name") for p in (d.get("result") or [])])'

      # One comment per PR, edited in place, so a branch pushed ten times does
      # not leave ten near-identical comments.
      - name: Post the preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "\
          Preview: $URL

          Built from \`${{ github.sha }}\`. \`docs/\` is generated, so this is the
          only way to read the branch without building it yourself.

          Behind Cloudflare Access — if it bounces you to a login you cannot
          complete, the Access policy needs to cover preview subdomains as well
          as the production hostname."
