# Example configuration for generate_periods.py.
#
#   python3 calendar-periods/generate_periods.py calendar-periods/example.yaml -o periods.ttl
#
# Load periods.ttl with sample-payments.ttl to run the queries on the
# suggested-calendar-extension page.

# Generated IRIs are {base}day/2025-11-16, {base}fiscal/acme-ltd/FY2026-Q3 and so
# on, written day:2025-11-16 and fiscal-acme-ltd:FY2026-Q3, one prefix per folder.
base: https://example.org/time/

# Days are generated for exactly this range, inclusive. Every month, quarter,
# year, fiscal period and season that overlaps it is generated whole.
range:
  start: 2025-04-01
  end: 2026-03-31

# Any of: day, week (ISO 8601), month, quarter, year, fiscal_quarter,
# fiscal_year, season. Omit for all but week.
granularity: [day, month, quarter, year, fiscal_quarter, fiscal_year, season]

# One or more organisations, each with its own fiscal calendar. A single
# `org:` mapping works too. Fiscal IRIs are namespaced by id.
orgs:
  - id: acme-ltd
    label: Acme Ltd
    iri: https://example.org/acme-ltd      # optional; default {base}org/{id}
    fiscal_year_start: {month: 4, day: 1}
    label_by: end                          # FY2026 = 1 Apr 2025 to 31 Mar 2026
    seasons: {scheme: meteorological, hemisphere: north}

  - id: supplier-ltd
    label: Supplier Ltd
    iri: https://example.org/supplier-ltd
    fiscal_year_start: {month: 7, day: 1}
    label_by: start                        # FY2025 = 1 Jul 2025 to 30 Jun 2026
    seasons: {scheme: astronomical, hemisphere: south}
